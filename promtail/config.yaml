server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push
scrape_configs:
  - job_name: kubernetes-pods
    static_configs:
      - targets: []
        labels:
          __path__: /var/log/pods/*/*/*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '^(?P<path>.*)/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_.*/(?P<container>[^/]+)/.*\.log$'
      - labels:
          namespace:
          pod:
          container:
          job: kubernetes-pods
